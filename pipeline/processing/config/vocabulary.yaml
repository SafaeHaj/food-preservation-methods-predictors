# ── Proximate composition ────────────────────────────────────────────────────
# Reported as a matrix's make-up rather than tracked over storage. They are indicators
# because a paper prints them as measured quantities with a unit; nothing sets a spoilage
# threshold on them, so none carries one.

  - name: Moisture content
    kind: indicator
    unit: "%"
    indicator_type: chemical
    aliases: [moisture, moisture percentage, water content]

  - name: Fat content
    kind: indicator
    unit: "%"
    indicator_type: chemical
    aliases: [fat, crude fat, total fat, lipid content, ether extract]

  - name: Protein content
    kind: indicator
    unit: "%"
    indicator_type: chemical
    aliases: [protein, crude protein, total protein]

  - name: Ash content
    kind: indicator
    unit: "%"
    indicator_type: chemical
    aliases: [ash, crude ash, total ash]

  - name: DPPH radical scavenging activity
    kind: indicator
    unit: "%"
    indicator_type: chemical
    aliases: [dpph, dpph scavenging activity, dpph radical scavenging, radical scavenging activity,
              dpph inhibition, antioxidant activity]

# ─────────────────────────────────────────────────────────────────────────────
# Recognition rules for the two closed protocol vocabularies.
#
# The KEYS are the closed sets, declared in `shared.schemas.science` as TREATMENT_TYPES and
# APPLICATION_METHODS -- they back CHECK constraints and pydantic Literals, so they cannot
# live here. The PATTERNS are corpus data: they grow as papers are read, no constraint
# references them, and tuning one is not a schema change.
#
# `test_vocabulary_keys_are_declared` asserts every key below is a member of its tuple, so
# a typo fails the suite instead of silently never matching.
#
# Matching is substring, lowercased. Prefer stems ("irradiat", "pasteuri") over whole words
# so a single entry covers the inflections a methods section actually uses.
# ─────────────────────────────────────────────────────────────────────────────

treatment_patterns:
  High-pressure processing: [high pressure, high-pressure, hpp, hydrostatic pressure, mpa]
  Irradiation: [irradiat, gamma ray, gamma-ray, kgy, e-beam, electron beam]
  UV treatment: [uv-c, uv light, uv treatment, ultraviolet]
  Ultrasound: [ultrasound, ultrasonic, sonicat]
  Cold plasma: [cold plasma, atmospheric plasma, plasma treatment]
  Ozone treatment: [ozone, ozonat, ozonis, ozoniz]
  Electrolyzed water treatment: [electrolyzed water, electrolysed water, anodic, cathodic,
                                 slightly acidic electrolyzed]
  Water washing: [water wash, washed with water, rinsed with water, tap water rinse]
  Surface trimming: [surface trimming, trimmed, trimming]
  Heat treatment: [autoclav, blanch, pasteuri, precook, pre-cook, cooked, cooking, thermal
                   treatment, boiled, boiling, fried, frying, sous vide]
  Vacuum treatment: [vacuum tumbling, vacuum impregnat, vacuum drying]

application_patterns:
  Mixed: [added to, incorporat, blend, mixed with, mixing, homogeni, ground with,
          film formulation]
  Dipped: [dipp, dipping, dip treatment]
  Sprayed: [spray]
  Washed: [washing solution, washed in, rinse]
  Coated: [coating, coated, edible film, film-forming, encapsulat]
  Injected: [inject, brine injection]
  Immersed: [immers, soak, submerg]
  Vacuum-packed: [vacuum pack, vacuum-pack, vacuum packag]
