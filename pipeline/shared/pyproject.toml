[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared DB models, schemas, config, security and auth for the pipeline services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "celery>=5.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["shared*"]
