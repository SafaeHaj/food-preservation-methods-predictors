x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set — see pipeline/.env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see pipeline/.env.example}@postgres:5432/${POSTGRES_DB:-food_research}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — see pipeline/.env.example}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

x-extraction-env: &extraction-env
  EXTRACTION_LLM_PROVIDER: ${EXTRACTION_LLM_PROVIDER:-ollama}
  EXTRACTION_OLLAMA_BASE_URL: ${EXTRACTION_OLLAMA_BASE_URL:-http://ollama:11434/v1}
  EXTRACTION_OLLAMA_MODEL: ${EXTRACTION_OLLAMA_MODEL:-llama3.2:3b}
  EXTRACTION_GROQ_API_KEY: ${EXTRACTION_GROQ_API_KEY:-}
  EXTRACTION_GROQ_FOOD_MODEL: ${EXTRACTION_GROQ_FOOD_MODEL:-llama-3.3-70b-versatile}
  EXTRACTION_MAX_UPLOAD_SIZE_MB: ${EXTRACTION_MAX_UPLOAD_SIZE_MB:-50}
  EXTRACTION_MAX_PAPERS_PER_UPLOAD: ${EXTRACTION_MAX_PAPERS_PER_UPLOAD:-10}
  EXTRACTION_PAGE_RENDER_ZOOM: ${EXTRACTION_PAGE_RENDER_ZOOM:-1.5}
  EXTRACTION_DOCLING_CACHE_VERSION: ${EXTRACTION_DOCLING_CACHE_VERSION:-1}
  EXTRACTION_AUTO_SELECT_MIN_SCORE: ${EXTRACTION_AUTO_SELECT_MIN_SCORE:-3.0}
  EXTRACTION_AUTO_SELECT_MIN_TABLE_SCORE: ${EXTRACTION_AUTO_SELECT_MIN_TABLE_SCORE:-1.0}
  STORAGE_DIR: /app/uploads

x-processing-env: &processing-env
  PROCESSING_PREDICTION_SERVICE_URL: http://prediction:8100
  PROCESSING_PREDICTION_TIMEOUT_SECONDS: ${PROCESSING_PREDICTION_TIMEOUT_SECONDS:-600}
  STORAGE_DIR: /app/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set — see pipeline/.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see pipeline/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-food_research}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-food_research}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EXTRACTION_OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  volume-init:
    image: alpine:3
    command: sh -c "chown -R 1000:1000 /uploads && echo 'shared volume chowned to 1000:1000'"
    volumes:
      - uploads:/uploads

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      EXTRACTION_SERVICE_URL: http://extraction:8001
      PROCESSING_SERVICE_URL: http://processing:8002
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["http://localhost:5173","http://localhost:3000"]'}
      ASSET_URL_TTL_SECONDS: ${ASSET_URL_TTL_SECONDS:-900}
      JOB_STREAM_POLL_SECONDS: ${JOB_STREAM_POLL_SECONDS:-1.0}
      JOB_STREAM_KEEPALIVE_SECONDS: ${JOB_STREAM_KEEPALIVE_SECONDS:-15}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS:-600}
    volumes:
      - ./gateway:/app
      - ./shared:/shared
    command: sh -c "cd /shared && alembic upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  extraction:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    expose:
      - "8001"
    environment:
      <<: [*common-env, *extraction-env]
    volumes:
      - ./extraction:/app
      - ./shared:/shared
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  processing:
    build:
      context: .
      dockerfile: processing/Dockerfile
    expose:
      - "8002"
    environment:
      <<: [*common-env, *processing-env]
    volumes:
      - ./processing:/app
      - ./shared:/shared
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prediction:
        condition: service_healthy

  prediction:
    build: ./prediction
    expose:
      - "8100"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SURVIVAL_ARTIFACT_DIR: /artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    volumes:
      - ./prediction:/app
      - prediction_artifacts:/artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  extraction-worker:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    environment:
      <<: [*common-env, *extraction-env]
    volumes:
      - ./extraction:/app
      - ./shared:/shared
      - uploads:/app/uploads
    user: "1000:1000"
    command: celery -A app.tasks worker -Q extraction --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully

  processing-worker:
    build:
      context: .
      dockerfile: processing/Dockerfile
    environment:
      <<: [*common-env, *processing-env]
    volumes:
      - ./processing:/app
      - ./shared:/shared
      - uploads:/app/uploads
    user: "1000:1000"
    command: celery -A app.tasks worker -Q processing --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_PROXY_TARGET: http://gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  uploads:
  redis_data:
  pgdata:
  prediction_artifacts:
  ollama_models:

