# Microservice topology:
#   frontend -> gateway (:8000, the ONLY published app service; verifies the JWT once)
#            -> extraction (:8001) | processing (:8002) -> prediction (:8100)
#
# All services share one Postgres. Long-running work (Docling parses, LLM ingestion, dataset
# builds) runs in the Celery workers, never in an API container.
#
# Values like ${SECRET_KEY} come from an optional pipeline/.env file; see .env.example.

# Settings every Python service needs. SECRET_KEY has no default on purpose: it signs both
# JWTs and asset URLs, so a shipped default would be a shipped private key, and every
# service must agree on it.
x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-food}:${POSTGRES_PASSWORD:-food}@postgres:5432/${POSTGRES_DB:-food_research}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — see pipeline/.env.example}
  INTERNAL_SECRET: ${INTERNAL_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

x-extraction-env: &extraction-env
  # LLM ingestion. Defaults to a local Ollama server (no API key needed); set
  # EXTRACTION_LLM_PROVIDER=groq to use Groq's hosted Llama instead.
  EXTRACTION_LLM_PROVIDER: ${EXTRACTION_LLM_PROVIDER:-ollama}
  EXTRACTION_OLLAMA_BASE_URL: ${EXTRACTION_OLLAMA_BASE_URL:-http://ollama:11434/v1}
  EXTRACTION_OLLAMA_MODEL: ${EXTRACTION_OLLAMA_MODEL:-llama3.2:3b}
  EXTRACTION_GROQ_API_KEY: ${EXTRACTION_GROQ_API_KEY:-}
  EXTRACTION_GROQ_FOOD_MODEL: ${EXTRACTION_GROQ_FOOD_MODEL:-llama-3.3-70b-versatile}
  EXTRACTION_MAX_UPLOAD_SIZE_MB: ${EXTRACTION_MAX_UPLOAD_SIZE_MB:-50}
  EXTRACTION_MAX_PAPERS_PER_UPLOAD: ${EXTRACTION_MAX_PAPERS_PER_UPLOAD:-10}
  EXTRACTION_PAGE_RENDER_ZOOM: ${EXTRACTION_PAGE_RENDER_ZOOM:-1.5}
  EXTRACTION_DOCLING_CACHE_VERSION: ${EXTRACTION_DOCLING_CACHE_VERSION:-1}
  EXTRACTION_AUTO_SELECT_MIN_SCORE: ${EXTRACTION_AUTO_SELECT_MIN_SCORE:-3.0}
  EXTRACTION_AUTO_SELECT_MIN_TABLE_SCORE: ${EXTRACTION_AUTO_SELECT_MIN_TABLE_SCORE:-1.0}
  # Uploads, Docling caches and evidence crops share one volume so the API and the worker
  # see the same files.
  STORAGE_DIR: /app/uploads

x-processing-env: &processing-env
  PROCESSING_PREDICTION_SERVICE_URL: http://prediction:8100
  PROCESSING_PREDICTION_TIMEOUT_SECONDS: ${PROCESSING_PREDICTION_TIMEOUT_SECONDS:-600}
  # Datasets are staged on the shared uploads volume, so the API and the worker see the
  # same files. The separate exports volume went with the snapshot-export flow.
  STORAGE_DIR: /app/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food}
      POSTGRES_DB: ${POSTGRES_DB:-food_research}
    ports:
      # Loopback only. A bare "5432:5432" binds every interface, putting the database --
      # with its default food/food credentials -- on the LAN, reachable without the
      # gateway, the JWT or INTERNAL_SECRET.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food} -d ${POSTGRES_DB:-food_research}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local open-source LLM for extraction. Runs Llama 3 (a reduced llama3.2:3b by default)
  # behind an OpenAI-compatible /v1 API, so the extraction worker needs no cloud key. CPU by
  # default; uncomment the `deploy` block to hand it an NVIDIA GPU where one is available.
  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # `ollama list` returns non-zero until the server is accepting requests.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot: tells the running ollama server to download the extraction model into its
  # volume, then exits. The extraction worker waits on this completing, so no LLM job starts
  # before its model is present. Re-runs are cheap — an already-pulled model is a no-op.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${EXTRACTION_OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  # Runs as root, chowns the shared volumes to the workers' UID, exits. Docker creates a
  # named volume owned by root, and the workers run as 1000:1000 (see extraction-worker),
  # so without this they cannot write Docling caches, page images or staged datasets. The
  # API containers cannot do this job: the `./extraction:/app` bind mount shadows the
  # image's /app/uploads, and nothing orders the workers after the APIs anyway.
  volume-init:
    image: alpine:3
    command: sh -c "chown -R 1000:1000 /uploads && echo 'shared volume chowned to 1000:1000'"
    volumes:
      - uploads:/uploads

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      EXTRACTION_SERVICE_URL: http://extraction:8001
      PROCESSING_SERVICE_URL: http://processing:8002
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-'["http://localhost:5173","http://localhost:3000"]'}
      ASSET_URL_TTL_SECONDS: ${ASSET_URL_TTL_SECONDS:-900}
      JOB_STREAM_POLL_SECONDS: ${JOB_STREAM_POLL_SECONDS:-1.0}
      JOB_STREAM_KEEPALIVE_SECONDS: ${JOB_STREAM_KEEPALIVE_SECONDS:-15}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS:-600}
    volumes:
      - ./gateway:/app
      - ./shared:/shared
    # The gateway is the single migration writer; it runs them before serving.
    command: sh -c "cd /shared && alembic upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Note the path: the gateway mounts its routes under /api, so its probe is /api/health
    # where the internal services use /health.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Generous: this container runs the migrations before it starts serving.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  extraction:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    expose:
      - "8001"
    environment:
      <<: [*common-env, *extraction-env]
    volumes:
      - ./extraction:/app
      - ./shared:/shared
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  processing:
    build:
      context: .
      dockerfile: processing/Dockerfile
    expose:
      - "8002"
    environment:
      <<: [*common-env, *processing-env]
    volumes:
      - ./processing:/app
      - ./shared:/shared
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prediction:
        condition: service_healthy

  prediction:
    build: ./prediction
    expose:
      - "8100"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SURVIVAL_ARTIFACT_DIR: /artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Only the secret, NOT the whole *common-env anchor. This service keeps its own
      # database, and its models declare `experiments`, `ingredients`, `indicators` and
      # `measurements` — now an exact name collision with the platform schema, which took
      # those names when the `ext_` prefix was dropped. Handing it DATABASE_URL would point
      # create_all at the shared Postgres and silently bind it to the wrong tables.
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
    volumes:
      - ./prediction:/app
      - prediction_artifacts:/artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Workers ─────────────────────────────────────────────────────────────────
  # These now carry every long-running pipeline. They share the uploads volume with their
  # API service because a Docling parse writes caches the API later serves.

  extraction-worker:
    build:
      context: .
      dockerfile: extraction/Dockerfile
    environment:
      <<: [*common-env, *extraction-env]
    volumes:
      - ./extraction:/app
      - ./shared:/shared
      - uploads:/app/uploads
    # Not root: these containers execute Docling parses and LLM output, the least trusted
    # code in the system. Celery warns about superuser privileges for exactly this reason.
    # Set on the service rather than in the Dockerfile so the API containers keep root and
    # their bind mounts stay writable. `volume-init` grants this UID the shared volumes.
    user: "1000:1000"
    command: celery -A app.tasks worker -Q extraction --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
      # This worker runs LLM ingestion, so hold it until the model has been pulled. Only a
      # hard dependency when using the local provider; harmless (a completed no-op) otherwise.
      ollama-pull:
        condition: service_completed_successfully

  processing-worker:
    build:
      context: .
      dockerfile: processing/Dockerfile
    environment:
      <<: [*common-env, *processing-env]
    volumes:
      - ./processing:/app
      - ./shared:/shared
      - uploads:/app/uploads
    user: "1000:1000"          # see extraction-worker
    command: celery -A app.tasks worker -Q processing --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The browser talks to the gateway directly.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # Where the dev server itself forwards /api. Not the same address as the one above:
      # that one is resolved by the browser on the host, this one from inside this
      # container, where "localhost" is the dev server and nothing listens on 8000.
      VITE_PROXY_TARGET: http://gateway:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      # service_healthy, not just "started": the gateway runs the migrations before it
      # serves, so a plain dependency starts the dev server against a dead API.
      gateway:
        condition: service_healthy

volumes:
  uploads:
  redis_data:
  pgdata:
  prediction_artifacts:
  ollama_models:
